onboarding = false
[keys]
prefix = "ctrl+a"
# new_tab = 'cmd+t'

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "shift+left"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left (vim/herdr)"

[[keys.command]]
key = "shift+down"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down (vim/herdr)"

[[keys.command]]
key = "shift+up"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up (vim/herdr)"

[[keys.command]]
key = "shift+right"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right (vim/herdr)"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "fullerzz.sesh.open-picker"
description = "sesh"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = false
